<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="DSH-MINECRAFT">
  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b3226"/>
      <stop offset="1" stop-color="#12160f"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cc750"/>
      <stop offset="0.55" stop-color="#5aa83a"/>
      <stop offset="1" stop-color="#3f862b"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="13" fill="url(#frame)"/>
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="#7fbf5f" stroke-opacity="0.5" stroke-width="1.5"/>

  <!-- 8x8 creeper skin, pixel = 6px, origin 8 -->
  <rect x="8" y="8" width="48" height="48" fill="url(#skin)"/>

  <!-- mottled darker green pixels -->
  <g fill="#4b8f33">
    <rect x="8" y="8" width="6" height="6"/>
    <rect x="26" y="8" width="6" height="6"/>
    <rect x="44" y="14" width="6" height="6"/>
    <rect x="14" y="20" width="6" height="6"/>
    <rect x="38" y="26" width="6" height="6"/>
    <rect x="8" y="32" width="6" height="6"/>
    <rect x="50" y="38" width="6" height="6"/>
    <rect x="20" y="44" width="6" height="6"/>
    <rect x="32" y="50" width="6" height="6"/>
    <rect x="44" y="50" width="6" height="6"/>
    <rect x="14" y="50" width="6" height="6"/>
  </g>
  <g fill="#8fd35c" opacity="0.55">
    <rect x="20" y="8" width="6" height="6"/>
    <rect x="38" y="14" width="6" height="6"/>
    <rect x="50" y="20" width="6" height="6"/>
    <rect x="26" y="38" width="6" height="6"/>
    <rect x="44" y="44" width="6" height="6"/>
    <rect x="8" y="44" width="6" height="6"/>
  </g>

  <!-- classic creeper face -->
  <g fill="#10160c">
    <!-- eyes -->
    <rect x="14" y="20" width="12" height="12"/>
    <rect x="38" y="20" width="12" height="12"/>
    <!-- mouth -->
    <rect x="26" y="32" width="12" height="12"/>
    <!-- mouth lower bar -->
    <rect x="20" y="44" width="24" height="6"/>
    <!-- mouth legs -->
    <rect x="20" y="50" width="6" height="6"/>
    <rect x="38" y="50" width="6" height="6"/>
  </g>
</svg>
